name: JPEG-LS Tests

# Builds CharLS from the vendored submodule, builds fpack/funpack, and runs
# the JPEG-LS test suite: round-trip correctness, near-lossless max-error
# bounds, and the lossless compression-ratio comparison against Rice,
# Hcompress and GZIP.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  jpegls:
    name: JPEG-LS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository (with CharLS submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify submodule is present
        run: |
          test -f charls/CMakeLists.txt \
            || { echo "CharLS submodule missing"; exit 1; }

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake \
                                  libcurl4-openssl-dev zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip numpy astropy

      - name: Build CharLS
        run: |
          cmake -S charls -B charls/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCHARLS_BUILD_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build charls/build -j

      - name: Configure CFITSIO
        run: ./configure

      - name: Build fpack and funpack
        run: make fpack funpack -j

      # NOT a help-text grep: fpack's usage text lists -jN whether or not CharLS
      # was compiled in, so grepping it would pass even on a build with JPEG-LS
      # stubbed out.  Actually compress something and require it to work.
      - name: Smoke test - JPEG-LS is really compiled in
        run: |
          python3 -c "
          from astropy.io import fits; import numpy as np
          fits.PrimaryHDU(np.arange(256*256, dtype=np.int16).reshape(256,256)
                          ).writeto('smoke.fit', overwrite=True)"
          ./fpack -j smoke.fit
          test -f smoke.fit.fz || { echo 'fpack -j produced no output'; exit 1; }
          ./funpack -O smoke_out.fit smoke.fit.fz
          python3 -c "
          from astropy.io import fits; import numpy as np, sys
          a = fits.getdata('smoke.fit'); b = fits.getdata('smoke_out.fit')
          sys.exit(0 if np.array_equal(a, b) else 'JPEG-LS round-trip mismatch')"
          rm -f smoke.fit smoke.fit.fz smoke_out.fit

      - name: Round-trip and near-lossless max-error tests
        run: python3 test_jpegls_nearlossless.py

      - name: Null-pixel, saturation and container-guard tests
        run: python3 test_jpegls_guards.py

      - name: Lossless compression-ratio comparison
        run: python3 test_jpegls_compression_ratio.py

  cmake-build:
    name: CMake build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CURL=OFF

      - name: Build
        run: cmake --build build --target fpack funpack -j

  without-charls:
    # JPEG-LS is an optional build-time feature.  This job proves CFITSIO still
    # builds and works when the CharLS submodule is absent -- the case of a
    # `make distcheck` tarball or a clone made without --recursive.  Without
    # this, a regression in the HAVE_CHARLS guards would go unnoticed, since
    # every other job has the submodule.
    name: Build without CharLS submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WITHOUT submodules
        uses: actions/checkout@v7        # note: no `submodules:` key

      - name: Confirm the submodule really is absent
        run: |
          test ! -f charls/include/charls/charls.h \
            || { echo "charls present; this job must run without it"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake \
                                  libcurl4-openssl-dev zlib1g-dev

      - name: Configure and build
        run: |
          ./configure
          make fpack funpack -j

      - name: Stock CFITSIO test suite still passes
        run: make check

      - name: Rice still works
        run: |
          python3 -m pip install --quiet numpy astropy
          python3 -c "
          from astropy.io import fits; import numpy as np
          fits.PrimaryHDU(np.arange(128*128, dtype=np.int16).reshape(128,128)
                          ).writeto('t.fit', overwrite=True)"
          ./fpack -r t.fit && test -f t.fit.fz

      - name: JPEG-LS fails cleanly rather than crashing or silently succeeding
        run: |
          rm -f t.fit.fz
          if ./fpack -j t.fit; then
            echo "fpack -j unexpectedly SUCCEEDED in a build without CharLS"
            exit 1
          fi
          ./fpack -j t.fit 2>&1 | grep -qi "without" \
            || { echo "missing the expected 'built without CharLS' message"; exit 1; }
