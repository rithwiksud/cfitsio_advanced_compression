name: JPEG-LS Tests

# Builds CharLS from the vendored submodule, builds fpack/funpack, and runs
# the JPEG-LS test suite: round-trip correctness for 8/16/32-bit data and a
# lossless compression-ratio comparison against Rice. This workflow has no
# Python or third-party dependency of any kind -- everything runs through
# CFITSIO's own C API and CLI tools, so it stays mergeable upstream without
# introducing a new dependency.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  jpegls:
    name: JPEG-LS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository (with CharLS submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify submodule is present
        run: |
          test -f charls/CMakeLists.txt \
            || { echo "CharLS submodule missing"; exit 1; }

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake \
                                  libcurl4-openssl-dev zlib1g-dev

      - name: Build CharLS
        run: |
          cmake -S charls -B charls/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCHARLS_BUILD_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build charls/build -j

      - name: Configure CFITSIO
        run: ./configure

      - name: Build fpack, funpack and libcfitsio
        run: make fpack funpack -j

      - name: Build the JPEG-LS C test suite and smoke-test helper
        run: |
          gcc -o test_jpegls_compression test_jpegls_compression.c \
            -I. -L./.libs -lcfitsio -lm
          gcc -o ci/smoke_test_helper ci/smoke_test_helper.c \
            -I. -L./.libs -lcfitsio -lm

      # Covers 8/16/32-bit lossless round-trip through the C API directly
      # (not fpack/funpack), plus a compression-ratio comparison vs Rice.
      - name: Round-trip and compression-ratio tests (C API)
        run: |
          export DYLD_LIBRARY_PATH="$PWD/.libs:$DYLD_LIBRARY_PATH"
          export LD_LIBRARY_PATH="$PWD/.libs:$LD_LIBRARY_PATH"
          ./test_jpegls_compression

      # NOT a help-text grep: fpack's usage text lists -jN whether or not
      # CharLS was compiled in, so grepping it would pass even on a build
      # with JPEG-LS stubbed out. Actually compress something and require
      # it to work. fpack/funpack add HISTORY/CHECKSUM cards on write, so
      # comparison is pixel data only (via the smoke-test helper), not a
      # raw byte diff of the two files.
      - name: Smoke test - JPEG-LS is really compiled in via fpack/funpack
        run: |
          export DYLD_LIBRARY_PATH="$PWD/.libs:$DYLD_LIBRARY_PATH"
          export LD_LIBRARY_PATH="$PWD/.libs:$LD_LIBRARY_PATH"
          rm -f smoke.fit smoke.fit.fz smoke_out.fit
          ./ci/smoke_test_helper create smoke.fit 256 256
          ./fpack -j smoke.fit
          test -f smoke.fit.fz || { echo 'fpack -j produced no output'; exit 1; }
          ./funpack -O smoke_out.fit smoke.fit.fz
          ./ci/smoke_test_helper compare smoke.fit smoke_out.fit
          rm -f smoke.fit smoke.fit.fz smoke_out.fit

  cmake-build:
    name: CMake build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CURL=OFF

      - name: Build
        run: cmake --build build --target fpack funpack -j

  without-charls:
    # JPEG-LS is an optional build-time feature.  This job proves CFITSIO still
    # builds and works when the CharLS submodule is absent -- the case of a
    # `make distcheck` tarball or a clone made without --recursive.  Without
    # this, a regression in the HAVE_CHARLS guards would go unnoticed, since
    # every other job has the submodule.
    name: Build without CharLS submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WITHOUT submodules
        uses: actions/checkout@v7        # note: no `submodules:` key

      - name: Confirm the submodule really is absent
        run: |
          test ! -f charls/include/charls/charls.h \
            || { echo "charls present; this job must run without it"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake \
                                  libcurl4-openssl-dev zlib1g-dev

      - name: Configure and build
        run: |
          ./configure
          make fpack funpack -j

      - name: Stock CFITSIO test suite still passes
        run: make check

      - name: Rice still works
        run: |
          export DYLD_LIBRARY_PATH="$PWD/.libs:$DYLD_LIBRARY_PATH"
          export LD_LIBRARY_PATH="$PWD/.libs:$LD_LIBRARY_PATH"
          gcc -o ci/smoke_test_helper ci/smoke_test_helper.c \
            -I. -L./.libs -lcfitsio -lm
          rm -f t.fit t.fit.fz
          ./ci/smoke_test_helper create t.fit 128 128
          ./fpack -r t.fit && test -f t.fit.fz

      - name: JPEG-LS fails cleanly rather than crashing or silently succeeding
        run: |
          rm -f t.fit.fz
          if ./fpack -j t.fit; then
            echo "fpack -j unexpectedly SUCCEEDED in a build without CharLS"
            exit 1
          fi
          ./fpack -j t.fit 2>&1 | grep -qi "without" \
            || { echo "missing the expected 'built without CharLS' message"; exit 1; }
